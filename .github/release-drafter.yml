name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
change-title-escapes: '\<*_&'

categories:
  - title: "Features"
    labels: [feat]
  - title: "Bug Fixes"
    labels: [fix]
  - title: "Documentation"
    labels: [docs]
  - title: "Refactoring"
    labels: [refactor]
  - title: "Testing"
    labels: [test]
  - title: "Chores"
    labels: [chore]
  - title: "Performance"
    labels: [perf]
  - title: "Style"
    labels: [style]
  - title: "CI/CD"
    labels: [ci]
  - title: "Build"
    labels: [build]
  - title: "Reverts"
    labels: [revert]

version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [minor, feat]
  patch:
    labels: [patch, fix, docs, refactor, test, chore, perf, style, ci, build, revert]
  default: patch

autolabeler:
  - label: "feat"
    branch: ['/^feat(ure)?\//']
    title: ['/^feat(\(.+\))?:/i']
  - label: "fix"
    branch: ['/^(fix|bugfix)\//']
    title: ['/^fix(\(.+\))?:/i']
  - label: "docs"
    branch: ['/^docs\//']
    title: ['/^docs(\(.+\))?:/i']
  - label: "refactor"
    branch: ['/^refactor\//']
    title: ['/^refactor(\(.+\))?:/i']
  - label: "test"
    branch: ['/^test\//']
    title: ['/^test(\(.+\))?:/i']
  - label: "chore"
    branch: ['/^chore\//']
    title: ['/^chore(\(.+\))?:/i']
  - label: "perf"
    branch: ['/^perf\//']
    title: ['/^perf(\(.+\))?:/i']
  - label: "style"
    branch: ['/^style\//']
    title: ['/^style(\(.+\))?:/i']
  - label: "ci"
    branch: ['/^ci\//']
    title: ['/^ci(\(.+\))?:/i']
  - label: "build"
    branch: ['/^build\//']
    title: ['/^build(\(.+\))?:/i']
  - label: "revert"
    title: ['/^revert:/i']
  - label: "breaking"
    title: ['/^[a-z]+(\(.+\))?!:/i']
    body: ['/^BREAKING CHANGE:/im']

template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
